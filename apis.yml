name: Fab.com
description: >-
  Fab.com is a digital content marketplace operated by Epic Games, where creators
  buy and sell 3D models, materials, environments, VFX, audio, and game-ready
  assets. Launched in October 2024, Fab consolidated four of Epic's prior
  storefronts — the Unreal Engine Marketplace, the Sketchfab Store, Quixel, and
  the ArtStation Marketplace — into a single catalog with unified licensing, and
  integrates into Unreal Engine, UEFN, and the Epic Games Launcher. The fabcom
  entry was originally added to the API Evangelist network as an a16z portfolio
  lead for the earlier, unrelated Fab.com flash-sale design-commerce company
  (2011–2015), which wound down before the domain passed to Epic Games; see
  x-identity-note. Fab publishes no public developer API, developer portal, or
  machine-readable specification as of this pass — the surface captured here is
  its documentation, support, and security-disclosure posture.
