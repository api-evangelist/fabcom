x-identity-note: >-
  Two distinct companies share this name. The a16z-backed Fab.com was Jason
  Goldberg's design-commerce marketplace, which wound down in 2015; it is defunct
  and has no live surface. The fab.com domain today resolves to Epic Games' Fab
  digital-asset marketplace, which is what was probed and described in this
  profile. No API artifacts are attributed to the defunct a16z-backed entity.
